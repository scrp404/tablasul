[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tablasul"
version = "0.1.0"
description = "First-principles synchronized PyWFS, Coronagraph, and Science PSF Data Simulator"
readme = "README.md"
authors = [{ name = "SCExAO / Tablasul Team" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
